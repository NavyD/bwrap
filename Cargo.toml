[package]
name = "bwrap"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/NavyD/bwrap"

[[bin]]
name = "mockbw"
path = "src/bin/mockbw.rs"
required-features = ["test-bin"]

# NOTE: 避免使用 toml 1.1 语法导致 `cargo metadata` 等工具的兼容问题
[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "macros", "tokio"] }
axum-reverse-proxy = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6.0"
fs4 = { version = "1", features = ["tokio"] }
heck = "0.5"
humantime = "2.4"
hyper = "1"
hyper-util = "0.1"
reqwest = { version = "0.13", features = [] }
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
# serde_json = "1"
sonic-rs = "0.5"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "io-std", "macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
which = "8.0"

[dev-dependencies]
assert_cmd = "2.2"
bon = "3.9"
# 仅在 test 启用 mockbw 相关的 bin
bwrap = { path = ".", default-features = false, features = ["test-bin"] }
httpmock = "0.8"
jsonpath-rust = "1.0"
predicates = "3.1"
proptest = "1.11"
rstest = "0.26"
serde_json = "1.0"
similar-asserts = "2.0"
tempfile = "3.27"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[features]
test-bin = []

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
