[package]
name = "bwrap"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = {
  version = "0.8",
  default-features = false,
  features = [
    "http1",
    "macros",
    "tokio",
  ]
}
axum-reverse-proxy = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6.0"
heck = "0.5"
humantime = "2.4"
hyper = "1"
hyper-util = "0.1"
reqwest = { version = "0.13", features = [] }
serde = { version = "1", features = ["derive"] }
# serde_json = "1"
sonic-rs = "0.5"
strum = { version = "0.28", features = ["derive"] }
tokio = {
  version = "1",
  features = [
    "fs",
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "time",
  ]
}
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
which = "8.0"
fs4 = { version = "1", features = ["tokio"] }

[dev-dependencies]
httpmock = "0.8"
proptest = "1.11"
rstest = "0.26"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
